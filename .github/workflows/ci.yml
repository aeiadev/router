name: CI
on:
  push:
  pull_request:
defaults:
  run:
    shell: bash
env:
  HARNESS_REPOSITORY: ${{ vars.HARNESS_REPOSITORY || 'aeiadev/harness' }}
  HARNESS_PINNED_REF: ${{ vars.HARNESS_REF }}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - name: Keep checkouts LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          path: harness
          fetch-depth: 0
      - name: Harness ref
        run: |
          set -euo pipefail
          ref=$(bash scripts/harness-ref.sh resolve harness VERSION "$HARNESS_PINNED_REF")
          git -C harness checkout -q --detach "$ref"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Old release trees
        run: |
          set -euo pipefail
          base=$RUNNER_TEMP/old-trees
          if command -v cygpath >/dev/null 2>&1; then base=$(cygpath -m "$base"); fi
          old_tree() {
            mkdir -p "$base/$2"
            archive="$base/$2.tar"
            git -C "$1" archive --format=tar --output="$archive" "$3"
            tar -xf - -C "$base/$2" < "$archive"
            rm "$archive"
            echo "$4=$base/$2" >> "$GITHUB_ENV"
          }
          old_tree . router-0.1 36acbafd839886fdff9d7ba7a416d6a8fad13ec5 ROUTER_V01
          old_tree . router-0.2 421454545008e0c361def01049989df5b9056b83 ROUTER_V02
          old_tree harness harness-0.1 063388b95632e935d53ba5ae058659b51960308d HARNESS_V01
          old_tree harness harness-0.2 3b80d6fbaa3d15970e6f0e1409d141b952f0b7f2 HARNESS_V02
      - name: Tests
        env:
          HARNESS_DIR: ${{ github.workspace }}/harness
        run: python tests/run_all.py
      - name: Shared pins
        if: ${{ !cancelled() }}
        run: |
          cd agents
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHARED.sha256; else shasum -a 256 -c SHARED.sha256; fi
      - name: Generated roles
        if: ${{ !cancelled() }}
        run: python scripts/generate_roles.py --check
      - name: Plugin drift
        if: ${{ !cancelled() }}
        run: python scripts/gen_plugin.py --check
      - name: Plugin validate
        if: ${{ !cancelled() }}
        run: |
          if command -v claude >/dev/null; then claude plugin validate .; claude plugin validate plugins/router; claude plugin validate plugins/shared-roles; fi
  together:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        harness-ref: [resolved, latest-tag]
    steps:
      - name: Keep checkouts LF
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          path: harness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Old release trees
        run: |
          set -euo pipefail
          base=$RUNNER_TEMP/old-trees
          if command -v cygpath >/dev/null 2>&1; then base=$(cygpath -m "$base"); fi
          old_tree() {
            mkdir -p "$base/$2"
            archive="$base/$2.tar"
            git -C "$1" archive --format=tar --output="$archive" "$3"
            tar -xf - -C "$base/$2" < "$archive"
            rm "$archive"
            echo "$4=$base/$2" >> "$GITHUB_ENV"
          }
          old_tree . router-0.1 36acbafd839886fdff9d7ba7a416d6a8fad13ec5 ROUTER_V01
          old_tree . router-0.2 421454545008e0c361def01049989df5b9056b83 ROUTER_V02
          old_tree harness harness-0.1 063388b95632e935d53ba5ae058659b51960308d HARNESS_V01
          old_tree harness harness-0.2 3b80d6fbaa3d15970e6f0e1409d141b952f0b7f2 HARNESS_V02
      - name: Harness ref
        env:
          MODE: ${{ matrix.harness-ref }}
        run: |
          set -euo pipefail
          if [ "$MODE" = latest-tag ]; then
            ref=$(bash scripts/harness-ref.sh latest harness VERSION)
            if [ -z "$ref" ]; then echo "notice: no Harness release tag for $(cat VERSION) yet"; exit 0; fi
          else
            ref=$(bash scripts/harness-ref.sh resolve harness VERSION "$HARNESS_PINNED_REF")
          fi
          git -C harness checkout -q --detach "$ref"
          echo "HARNESS_REF=$ref" >> "$GITHUB_ENV"
      - name: Together
        if: env.HARNESS_REF != ''
        run: HARNESS_DIR=$PWD/harness bash tests/together.sh
  shared-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          path: harness
          fetch-depth: 0
      - name: Harness ref
        run: |
          set -euo pipefail
          ref=$(bash scripts/harness-ref.sh resolve harness VERSION "$HARNESS_PINNED_REF")
          git -C harness checkout -q --detach "$ref"
      - run: cmp agents/SHARED.sha256 harness/agents/SHARED.sha256
  ssh-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          path: harness
          fetch-depth: 0
      - name: Harness ref
        run: |
          set -euo pipefail
          ref=$(bash scripts/harness-ref.sh resolve harness VERSION "$HARNESS_PINNED_REF")
          if [ -z "$ref" ]; then echo "error: no Harness ref resolved for the SSH fixture" >&2; exit 1; fi
          git -C harness checkout -q --detach "$ref"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build pinned SSH fixture
        run: |
          set -euo pipefail
          podman pull docker.io/library/ubuntu@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          python3 -B harness/tests/fixtures/ssh-disposable/run.py --engine podman --build
      - name: Required SSH workflow proof
        env:
          SSH_FIXTURE_ENGINE: podman
          HARNESS_DIR: ${{ github.workspace }}/harness
        run: SSH_FIXTURE_REQUIRED=1 python3 -B tests/test_operations_ssh.py
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.18.4 detect --source . --no-banner
